<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('notes.index') }}">{{ app_name }}</a>
        <form class="search" action="{{ url_for('notes.index') }}" method="get">
            <input type="search" name="q" value="{{ query or '' }}" placeholder="Search notes">
            <button type="submit">Search</button>
        </form>
        <a class="button" href="{{ url_for('notes.new') }}">New note</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
