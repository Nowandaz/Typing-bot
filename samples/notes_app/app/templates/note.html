{% extends "base.html" %}

{% block title %}{{ note.title or "New note" }} — {{ app_name }}{% endblock %}

{% block content %}
{% if editing %}
<form class="editor" method="post" action="{{ url_for('notes.save') }}">
    <input type="hidden" name="id" value="{{ note.id if not creating else '' }}">
    <input class="title" type="text" name="title" value="{{ note.title }}"
           placeholder="Title" required autofocus>
    <textarea class="body" name="body" rows="18" placeholder="Write something…">{{ note.body }}</textarea>
    <input class="tags-input" type="text" name="tags" value="{{ note.tags | join(', ') }}"
           placeholder="tags, comma, separated">
    <div class="actions">
        <button class="button" type="submit">Save</button>
        <a href="{{ url_for('notes.index') }}">Cancel</a>
    </div>
</form>
{% else %}
<article class="full">
    <h1>{{ note.title }}</h1>
    <div class="meta">
        {% for tag in note.tags %}
        <a class="pill" href="{{ url_for('notes.index', tag=tag) }}">{{ tag }}</a>
        {% endfor %}
    </div>
    <div class="content">{{ note.body }}</div>
    <div class="actions">
        <a class="button" href="{{ url_for('notes.edit', note_id=note.id) }}">Edit</a>
        <form method="post" action="{{ url_for('notes.delete', note_id=note.id) }}"
              onsubmit="return confirm('Delete this note?');">
            <button class="danger" type="submit">Delete</button>
        </form>
    </div>
</article>
{% endif %}
{% endblock %}
